name: Crear APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar herramientas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev automake autopoint gettext

      - name: Instalar Buildozer
        run: pip install buildozer "setuptools<71" cython==0.29.34 virtualenv

      - name: Compilar la APK
        run: buildozer android debug

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
